name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealer
          POSTGRES_PASSWORD: dealer_dev_password
          POSTGRES_DB: dealer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealer -d dealer_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dealer/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @dealer/api db:generate
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
